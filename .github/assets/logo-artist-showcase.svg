<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200" role="img">
  <title>Isa Tavares Cantora — Artist Showcase</title>
  <desc>Logomarca do projeto Artist Showcase</desc>

  <defs>
    <style>
      .logo-circle { fill: transparent; stroke: #FF4D8D; stroke-width: 1.5; }
      .logo-note { fill: #FF4D8D; }
      .logo-stem { stroke: #FF4D8D; stroke-width: 3; stroke-linecap: round; fill: none; }
      .logo-flag { stroke: #FF4D8D; stroke-width: 2.5; fill: none; stroke-linecap: round; }
      .logo-name {
        font-family: Georgia, serif;
        font-size: 15px;
        font-weight: 600;
        fill: #FF4D8D;
        letter-spacing: 0.3px;
      }
      .logo-sub {
        font-family: system-ui, sans-serif;
        font-size: 11px;
        fill: #FF4D8D;
        opacity: 0.85;
        font-weight: 500;
      }
      .logo-line { stroke: #FF4D8D; stroke-width: 0.8; opacity: 0.4; }
    </style>
  </defs>

  <!-- Círculo -->
  <circle cx="100" cy="80" r="60" class="logo-circle"/>

  <!-- Nota musical — cabeça -->
  <ellipse cx="88" cy="107" rx="10" ry="7"
    transform="rotate(-20 88 107)" class="logo-note"/>

  <!-- Haste -->
  <line x1="97" y1="103" x2="97" y2="53" class="logo-stem"/>

  <!-- Bandeirola 1 -->
  <path d="M97 53 Q122 61 116 77" class="logo-flag"/>

  <!-- Bandeirola 2 -->
  <path d="M97 65 Q120 73 114 88" class="logo-flag"/>

  <!-- Nome -->
  <text x="100" y="160" text-anchor="middle" class="logo-name">
    Isa Tavares Cantora
  </text>

  <!-- Subtítulo -->
  <text x="100" y="178" text-anchor="middle"
    class="logo-sub"
    textLength="138"
    lengthAdjust="spacing">PORTFÓLIO ARTÍSTICO</text>

  <!-- Linha decorativa -->
  <line x1="31" y1="186" x2="169" y2="186" class="logo-line"/>
</svg>
